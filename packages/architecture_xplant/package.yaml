knowledge_matrix:
- entity_name: XPlant2.0
  domain: architecture
  archetype: architecture_design
  core_function: 面向山地景观规划与参数化种植设计的 Rhino／Grasshopper 工具平台，将地形分析、现状评价、专项设计和成果输出整合为可连接、可复用的组件体系。
  hardware_specs: 常规设计工作站 (建议 16G 内存 + 独立显卡)
  environment: Rhino / Grasshopper 平台 + 空间分析/GIS 插件组件
  local_deployable: 🟢 纯本地离线运行 (基于本地 Rhino/Grasshopper 本地计算与离线 Mesh 分析)
  competitive_advantages:
  - 【多模态空间数据输入】支持测绘高程点、等高线、地形 Mesh、土地利用及外部模型数据，建立从空间分析到方案生成完整流程。
  - 【全专项功能组件覆盖】覆盖总体规划、山地植物设计、生态修复、海绵雨洪、水库堰塞湖安全、道路游线、建筑设施选址、边坡地质安全、土方竖向等。
  - 【设计依据量化可追溯】把复杂地形转化为量化分析结果，直接驱动分区、选址、路径组织和种植配置，支持多方案迭代。
  limitations_and_pitfalls:
  - 【当前版本边界】当前处于 DEMO 版本阶段，仍处于持续演进与功能完善中。
  - 【工程安全规划筛查】工程安全类工具主要服务于规划阶段筛查，专业深入设计需衔接专业工程力学模型验证。
  quickstart_commands: []
