  core_function: 围绕 XPlant2.0 打造的全自动化逻辑推演与工程实现工作流
  hardware_specs: 标准机器配置 (8G 内存即可无痛运行)
  environment: 跨平台标准环境 (支持 macOS / Linux / Windows)
  local_deployable: 🟢 本地命令行/独立工具 (无强联网依赖)
  competitive_advantages:
  - 【成熟生态】工具链模块解耦度高，支持快速组合并无缝嵌入现有工程流。
  - 【透明推演】输出具备完整的上下文依据与调用日志，结论可二次逐项核对。
  - 【能力突破】针对特定业务痛点提供显著效率提升与流程优化。
  - 【端到端协同】从目标分析、环境依赖配齐到成果交付，构建一体化工作流。
  limitations_and_pitfalls:
  - 【合规红线】严格限定合法学习或授权复刻，遵守开源许可与数据安全规范。
  - 【环境排错】涉及多工具串联，遇到报错应保留完整日志并逐项单点排查，切忌全量同时修改。
  - 【复刻边界】切忌盲目原样搬运；核心在于摸清行为逻辑后独立自研重写。
  - 【安全界限】自动化工具仅提供初步分析，复杂业务逻辑与生产环境仍需人工专项复核。
