knowledge_matrix:
- entity_name: OpenSRE：让 AI 帮你排查线上故
  domain: engineering
  archetype: creative_multimodal
  core_function: '核心解决痛点: 让 AI 帮你排查线上故障；装上之后你的 AI 能多做什么: 让 AI 帮你排查线上故障，显著突破传统工作流瓶颈。'
  hardware_specs: '硬件要求: Linux 运维中控机或 Kubernetes 集群节点，轻量级容器化部署 / 运行环境: Kubernetes
    + Prometheus + Grafana + OpenTelemetry API'
  environment: '硬件要求: Linux 运维中控机或 Kubernetes 集群节点，轻量级容器化部署 + 运行环境: Kubernetes + Prometheus
    + Grafana + OpenTelemetry API'
  local_deployable: '本地化支持: 🟢 100% 私有云 / VPC 内网封闭运行 (内置敏感信息打码脱敏，严防线上数据泄露)'
  competitive_advantages:
  - 【60+ 运维工具深度联动】告警一来自动拉取指标、日志、Tracing 链路与部署 Commit 并行排查。
  - 【假设-验证闭环】提出假设、调取证据链验证假设，杜绝凭空臆测，结论 100% 附带排查依据。
  - 【演练场自我演进】内置万种真实线上故障靶场测试，让 AI SRE 智能体持续对抗演练进化。
  limitations_and_pitfalls:
  - 【合规红线】严格限定合法学习或授权复刻，严禁对明确禁止逆向或商业加密混淆做对抗。
  - 【环境排错】涉及多工具串联，遇到报错应保留完整日志并逐项单点排查，切忌全量同时修改。
  - 【复刻边界】切忌盲目原样搬运代码或素材；复刻核心在于摸清行为逻辑后独立自研重写。
  - 【安全界限】自动化工具仅提供初步扫描，业务逻辑漏洞与敏感权限仍需人工专项复核。
  quickstart_commands:
