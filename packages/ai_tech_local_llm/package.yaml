  core_function: '核心解决痛点: 用免费额度跑 Claude Code 这类编程工具；装上之后你的 AI 能多做什么: 用免费额度跑 Claude
    Code 这类编程工具，显著突破传统工作流瓶颈。'
  hardware_specs: '硬件要求: 代理本身极度轻量；若运行本地大模型建议 8GB+ 显存 / 运行环境: Node.js 18+ 或 Python
    3.10+ + Claude Code CLI'
  environment: '硬件要求: 代理本身极度轻量；若运行本地大模型建议 8GB+ 显存 + 运行环境: Node.js 18+ 或 Python 3.10+
    + Claude Code CLI'
  local_deployable: '本地化支持: 🟡 本地网关服务 (网关运行于 127.0.0.1；若对接 Ollama 则全流程纯离线脱网)'
  competitive_advantages:
  - 【官方原生 CLI 体验】完美保留 Claude Code 优秀的交互体验与多工具调用生态。
  - 【零账单成本开销】充分利用 Gemini 2.0 Flash 极高免费配额或 Groq 极速推理，免除昂贵 Token 费。
  - 【热插拔多模型切换】可在云端免费模型与本地私有模型间秒级灵活切换。
  limitations_and_pitfalls:
  - 【合规红线】严格限定合法学习或授权复刻，严禁对明确禁止逆向或商业加密混淆做对抗。
  - 【环境排错】涉及多工具串联，遇到报错应保留完整日志并逐项单点排查，切忌全量同时修改。
  - 【复刻边界】切忌盲目原样搬运代码或素材；复刻核心在于摸清行为逻辑后独立自研重写。
  - 【安全界限】自动化工具仅提供初步扫描，业务逻辑漏洞与敏感权限仍需人工专项复核。
