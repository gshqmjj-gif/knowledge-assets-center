- entity_name: 《苏轼》信息可视化设计
  domain: new_topic
  archetype: general_tech
  core_function: 以新中式美学为载体，通过多维度信息图表系统梳理人物一生仕途轨迹、文学创作流派、贬谪空间网络与文化脉络全景。
  hardware_specs: 标准图形设计配置 (8G 内存以上，支持矢量渲染)
  environment: 矢量制图与排版平台 (Figma / Illustrator / D3.js)
  local_deployable: 🟢 纯本地离线设计 (高清图版脱网可用)
  competitive_advantages:
  - 【五大核心信息模块】涵盖人生时序时间轴、地理行旅轨迹图、诗词创作情感雷达、人际社交关系网与文化地标知识图谱。
  - 【新中式信息设计范式】将传统中国传统色彩体系、宋代版画韵味与现代高密度信息图表排版深度融合。
  - 【高信息密度叙事】兼具学术严谨性与审美视觉冲击力，支持多层级细读与宏观概览。
  limitations_and_pitfalls:
  - 【大画幅阅读设备适配】超长图与超大尺寸信息图在小屏移动端需切片处理，更适合大屏或实体画册展现。
  - 【数据整理密度高】前期人物年谱与地理坐标考证工作量极大，需严格校验历史文献源。
